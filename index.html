<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101317" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f7f8" media="(prefers-color-scheme: light)">
<meta name="description" content="A local-first journal for swing trades, denominated in R.">
<title>Trade Journal</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./src/ui/styles.css">
<link rel="stylesheet" href="./src/ui/release.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23101317'/><text x='16' y='23' font-family='monospace' font-size='19' font-weight='700' fill='%234cae7c' text-anchor='middle'>R</text></svg>">
</head>
<body>
<div id="app">
  <main class="screen"><p class="muted" style="text-align:center;padding:40px 0">Loading your journal…</p></main>
</div>
<script type="module">
  import { boot } from './src/ui/app.js';
  boot().catch((err) => {
    console.error(err);
    document.getElementById('app').innerHTML =
      `<main class="screen"><div class="empty-state">
         <p>The journal could not start.</p>
         <p class="muted">${err.message}</p>
       </div></main>`;
  });
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () =>
      navigator.serviceWorker.register('./sw.js').catch(() => {})
    );
  }
</script>
</body>
</html>
